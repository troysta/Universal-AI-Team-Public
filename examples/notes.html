<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline Notes</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fa; color: #192b45; padding: 24px 14px; }
    main { max-width: 580px; margin: 0 auto; padding: 24px; background: white; border: 1px solid #dce2ec; border-radius: 16px; box-shadow: 0 3px 18px #172c4510; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 20px 0 8px; }
    textarea { display: block; width: 100%; min-height: 116px; padding: 12px; font: inherit; line-height: 1.4; border: 1px solid #8592a5; border-radius: 9px; resize: vertical; }
    textarea:focus-visible, button:focus-visible { outline: 3px solid #4a82d9; outline-offset: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button { min-height: 44px; padding: 11px 17px; border-radius: 9px; border: 1px solid #243c5d; font: inherit; font-weight: 650; cursor: pointer; }
    #save { background: #193c69; color: white; }
    #clear { background: white; color: #193c69; }
    #status { min-height: 1.5em; margin: 12px 0; color: #9b2635; font-weight: 600; }
    #status.success { color: #176447; }
    .note { margin-top: 8px; padding: 14px; border-radius: 9px; background: #edf2fa; overflow-wrap: anywhere; white-space: pre-wrap; min-height: 48px; }
    @media (max-width: 390px) { main { padding: 18px 14px; } .actions button { flex: 1 1 120px; } }
  </style>
</head>
<body>
  <main>
    <h1>My Offline Note</h1>
    <p>Write a short note and display it below. Notes are not saved when you close or refresh this page.</p>
    <form id="note-form" novalidate>
      <label for="entry">Your note</label>
      <textarea id="entry" maxlength="1000" placeholder="Type your note here…" aria-describedby="status"></textarea>
      <div class="actions">
        <button id="save" type="submit">Display note</button>
        <button id="clear" type="button">Clear note</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="note-heading">
      <h2 id="note-heading">Displayed note</h2>
      <div id="display" class="note" aria-live="polite">No note displayed yet.</div>
    </section>
  </main>
  <script>
    'use strict';
    const form = document.getElementById('note-form');
    const entry = document.getElementById('entry');
    const display = document.getElementById('display');
    const status = document.getElementById('status');
    function setStatus(message, success) {
      status.textContent = message;
      status.classList.toggle('success', Boolean(success));
    }
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const note = entry.value.trim();
      if (!note) {
        setStatus('Please enter a note before displaying it.', false);
        entry.focus();
        return;
      }
      display.textContent = note;
      setStatus('Note displayed.', true);
    });
    document.getElementById('clear').addEventListener('click', function () {
      entry.value = '';
      display.textContent = 'No note displayed yet.';
      setStatus('Note cleared.', true);
      entry.focus();
    });
  </script>
</body>
</html>
